<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Torneos GR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Registro al torneo</h1>
        <p>Super Smash Bros. Ultimate</p>
    </header>

    <main>

        <section class="registro">

            <h2>Datos del participante</h2>

            <form>

                <label for="nombre">Nombre completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >

                <label for="nickname">Nickname / Gamertag</label>
                <input 
                    type="text" 
                    id="nickname" 
                    name="nickname"
                    placeholder="Tu nombre dentro del juego"
                    required
                >

                <label for="discord">Discord</label>
                <input 
                    type="text" 
                    id="discord" 
                    name="discord"
                    placeholder="Ejemplo: usuario123"
                    required
                >

                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="tucorreo@ejemplo.com"
                    required
                >

                <label for="contacto">Otro medio de contacto</label>
                <input 
                    type="text" 
                    id="contacto" 
                    name="contacto"
                    placeholder="Opcional"
                >

                <h2>Pago</h2>

                <p class="precio">
                    Costo de inscripción: <strong>$XX MXN</strong>
                </p>

                <p>
                    Después de enviar tus datos podrás continuar con el proceso
                    de pago para completar tu inscripción.
                </p>

                <button type="submit">
                    Continuar al pago
                </button>

            </form>

        </section>

    </main>

</body>

</html>
